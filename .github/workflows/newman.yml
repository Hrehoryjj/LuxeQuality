name: Run Postman tests

on:
  push:
    branches: [main, task.5]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server dependencies
        working-directory: task.5
        run: npm i

      - name: Start local server
        working-directory: task.5
        run: npm run tern-on-api &

      - name: Wait for server
        run: sleep 5

      - name: Install Newman
        run: npm i -g newman

      - name: Run collection
        run: newman run task.5/store.collection.json