name: Mobile Automation Tests

on:
  push:
    branches: [task.8, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: task.8

      - name: Run tests on Device 1 (Samsung Galaxy S22 Ultra)
        run: npx wdio run wdio.conf.js
        working-directory: task.8

      - name: Run tests on Device 2 (Google Pixel 8 Pro)
        run: npx wdio run wdio.device2.conf.js
        working-directory: task.8

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: task.8/allure-results