name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true

    - name: Get Allure history from gh-pages
      uses: actions/checkout@v4
      if: ${{ !cancelled() }}
      with:
        ref: gh-pages
        path: gh-pages-dir
        continue-on-error: true

    - name: Move previous Allure history to results
      if: ${{ !cancelled() }}
      run: |
        mkdir -p allure-results/history
        if [ -d "gh-pages-dir/history" ]; then
          cp -r gh-pages-dir/history/* allure-results/history/
        fi

    - name: Build Allure Report
      uses: simple-elf/allure-report-action@v1.9
      if: ${{ !cancelled() }}
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy Allure Report to GitHub Pages branch
      uses: peaceiris/actions-gh-pages@v4
      if: ${{ !cancelled() }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-history
        publish_branch: gh-pages
